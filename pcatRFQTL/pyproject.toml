# ============================================================
# PCa-tRFQTL Project
#
# File:
#     pyproject.toml
#
# Description:
#     Project metadata, dependencies, build configuration,
#     development tools, and command-line entry points.
#
# Author:
#     I Putu Indra Arsana
# ============================================================

[project]
name = "pcatrfqtl"
version = "0.1.0"
description = "Integrative analysis of prostate cancer GWAS, tRF-QTL, iso-eQTL, and sQTL data."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=17.0",
    "scipy>=1.14",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    "openpyxl>=3.1.5",
]

[project.scripts]
pcatrfqtl = "pcatrfqtl.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pcatrfqtl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
