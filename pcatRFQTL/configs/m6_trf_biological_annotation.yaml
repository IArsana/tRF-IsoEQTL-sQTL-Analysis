  expected_parent_trna_available:
    false

  expected_gene_resolution:
    false

  expected_annotation_level:
    "PARTIAL_SOURCE_SUPPORTED_CONTEXT"


# ============================================================================
# Next stage
# ============================================================================

next_stage:

  id:
    "M6.4B"

  label:
    "PATHWAY_READINESS_ASSESSMENT"

  stage:
    "M6.4B_PATHWAY_READINESS_ASSESSMENT"