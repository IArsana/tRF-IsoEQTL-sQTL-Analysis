# =============================================================================
# Dataset Configuration
# =============================================================================
#
# Project: pcatRFQTL
# Purpose:
#   Central registry for all raw, intermediate, and processed datasets used
#   in the prostate cancer tRF-QTL / isoform-QTL integrative analysis.
#
# Author:
#   I Putu Indra Arsana
#
# Notes:
#   - Raw datasets must remain immutable.
#   - Dataset-specific transformations belong in the ingestion modules.
#   - Genome builds must be explicitly tracked.
#   - File paths are relative to the project root.
#
# =============================================================================


project:
  name: pcatRFQTL
  description: >
    Integrative analysis of tRNA-derived fragment quantitative trait loci,
    prostate cancer genetic risk, and isoform-level regulatory associations.

  author:
    name: I Putu Indra Arsana

  data_policy:
    raw_data_immutable: true
    relative_paths: true


# =============================================================================
# Directory Configuration
# =============================================================================

directories:

  raw:
    path: data/raw

  interim:
    path: data/interim

  processed:
    path: data/processed


# =============================================================================
# Dataset Registry
# =============================================================================

datasets:


  # ===========================================================================
  # 1. GWAS Catalog
  # ===========================================================================

  gwas_catalog:

    id: gwas_catalog_associations

    name: GWAS Catalog Association Dataset

    description: >
      Full GWAS Catalog association dataset containing published genome-wide
      association study associations. This dataset is used as a source for
      identifying prostate cancer-associated genetic variants and for
      downstream overlap with tRF-QTL loci.

    source:
      organization: NHGRI-EBI GWAS Catalog
      database: GWAS Catalog
      data_type: gwas_association_summary
      access_type: public

    files:
      associations:
        path: data/raw/gwas/gwas-catalog-download-associations-alt-full.tsv
        format: tsv
        compression: none

    genome:
      build: >
        Dataset-dependent. GWAS Catalog records may contain genomic
        coordinates mapped to the reference genome specified by the source
        record.
      coordinate_system: genomic

    primary_key:
      - study_accession
      - snp_id

    expected_core_fields:
      - STUDY
      - SNP
      - DISEASE/TRAIT
      - P-VALUE
      - PVALUE_MLOG
      - MAPPED_GENE
      - CHR_ID
      - CHR_POS
      - REPORTED GENE(S)
      - PUBLISHED_DATE

    intended_use:
      - prostate_cancer_gwas_filtering
      - SNP_annotation
      - cancer_risk_association
      - tRF_QTL_overlap
      - genomic_locus_annotation

    filtering:
      primary_trait:
        - Prostate cancer

    output:
      standardized:
        path: data/interim/gwas/gwas_catalog.parquet
        format: parquet

      prostate_cancer:
        path: data/interim/gwas/prostate_cancer_gwas.parquet
        format: parquet

    validation:
      required:
        - SNPS
        - CHR_ID
        - CHR_POS
        - P-VALUE

      optional_columns:
        - PUBMEDID
        - FIRST AUTHOR
        - STUDY
        - DISEASE/TRAIT
        - MAPPED_GENE
        - STRONGEST SNP-RISK ALLELE
        - RISK ALLELE FREQUENCY
        - OR or BETA
        - PVALUE_MLOG
        - STUDY ACCESSION
            
      checks:
        - valid_p_values
        - valid_snp_identifiers
        - non_empty_trait
        - genomic_coordinate_consistency

    provenance:
      raw_file_must_not_be_modified: true


    # ===========================================================================
  # 2. Cancer-tRFQTL
  # ===========================================================================

  cancer_trfqtl:

    id: cancer_trfqtl_supplementary

    name: Cancer-tRFQTL Supplementary Dataset

    description: >
      Supplementary data from the Cancer-tRFQTL study containing
      pan-cancer tRNA-derived fragment quantitative trait loci,
      GWAS-associated tRFQTLs, survival-associated tRFQTLs,
      immune infiltration associations, drug-response associations,
      cross-ancestry GWAS meta-analysis information, cancer-risk-associated
      tRFQTLs, cohort characteristics, experimental sequences, and
      POU2F1-regulated genes.

    source:
      study: Cancer-tRFQTL
      publication_identifier: can-25-1282
      data_type: supplementary_research_data
      access_type: public

    files:

      workbook:
        path: data/raw/trfqtl/can-25-1282_supplementary_data_suppst1-11.xlsx
        format: xlsx

        expected_sheets:
          - S1
          - S2
          - S3
          - S4
          - S5
          - S6
          - S7
          - S8
          - S9
          - S10
          - S11

        sheets:

          S1:
            title: "Survival-associated tRFQTLs"
            role: secondary
            header_row: 1

          S2:
            title: "GWAS-associated tRFQTLs"
            role: primary
            header_row: 1

          S3:
            title: "Cross-ancestry genome-wide meta-analysis"
            role: metadata
            header_row: 1

          S4:
            title: "tRF-immune infiltration associations"
            role: secondary
            header_row: 1

          S5:
            title: "tRF-drug response associations"
            role: secondary
            header_row: 1

          S6:
            title: "Chinese population characteristics"
            role: metadata
            header_row: 1

          S7:
            title: "Probe or primer sequences"
            role: metadata
            header_row: 1

          S8:
            title: "UK Biobank characteristics"
            role: metadata
            header_row: 1

          S9:
            title: "PLCO cohort characteristics"
            role: metadata
            header_row: 1

          S10:
            title: "Cancer-risk-associated tRFQTLs"
            role: primary
            header_row: 1

          S11:
            title: "POU2F1-regulated differentially expressed genes"
            role: secondary
            header_row: 1

    genome:
      build: hg19

    workbook:
      number_of_sheets: 11

      sheets:

        S1:
          name: survival_associated_tRFQTLs
          title: >
            Survival-associated tRFQTLs across 31 human cancers

          role: supplementary
          analysis_priority: secondary

          expected_columns:
            - Cancer type
            - SNP ID
            - SNP position (hg19)
            - Alleles
            - tRF
            - Median survival time AA
            - Median survival time Aa
            - Median survival time aa
            - P-value (survival)

          intended_use:
            - survival_annotation
            - downstream_clinical_interpretation

        S2:
          name: gwas_associated_tRFQTLs
          title: >
            GWAS-associated tRFQTLs across 31 human cancers

          role: core
          analysis_priority: primary

          expected_columns:
            - Cancer type
            - SNP ID
            - SNP position (hg19)
            - Alleles
            - tRF
            - statistic
            - P-value
            - FDR
            - GWAS tagSnp
            - LD (r2)

          intended_use:
            - tRF_QTL_analysis
            - prostate_cancer_filtering
            - GWAS_tRFQTL_integration
            - LD_analysis

          cancer_filter:
            primary:
              - PRAD

        S3:
          name: cross_ancestry_gwas_meta_analysis
          title: >
            Detailed information regarding the cross-ancestry
            genome-wide meta-analyses

          role: supplementary
          analysis_priority: secondary

          expected_columns:
            - Cancer type
            - Sub-study name
            - No. of cases in study
            - No. of controls in study
            - Individual or summary level data
            - Design, location
            - Study reference

          intended_use:
            - study_design_annotation
            - ancestry_annotation
            - GWAS_provenance

        S4:
          name: trf_immune_infiltration
          title: >
            tRF-immune infiltration associations across 31 cancer types

          role: supplementary
          analysis_priority: secondary

          expected_columns:
            - Cancer type
            - Cell type
            - tRF
            - Correlation coefficient
            - Correlation P-value
            - Method

          intended_use:
            - immune_microenvironment_annotation
            - biological_interpretation

        S5:
          name: trf_drug_response
          title: >
            tRF-drug response associations across 31 cancer types

          role: supplementary
          analysis_priority: secondary

          expected_columns:
            - Cancer type
            - Drug
            - tRF
            - Correlation coefficient
            - Correlation P-value

          intended_use:
            - drug_response_annotation
            - translational_interpretation

        S6:
          name: chinese_cohort_characteristics
          title: >
            Summary of characteristics of individuals from the
            Chinese population

          role: supplementary
          analysis_priority: low

          intended_use:
            - cohort_annotation
            - ancestry_context

        S7:
          name: probe_primer_sequences
          title: >
            Probe or primer sequence used in the study

          role: supplementary
          analysis_priority: low

          expected_columns:
            - qRT-PCR (5'-3')

          intended_use:
            - experimental_validation
            - tRF_sequence_annotation

        S8:
          name: uk_biobank_characteristics
          title: >
            Summary of characteristics of individuals from the
            UK Biobank cohort

          role: supplementary
          analysis_priority: low

          intended_use:
            - cohort_annotation
            - replication_context

        S9:
          name: plco_cohort_characteristics
          title: >
            Summary of characteristics of individuals from the
            PLCO cohort

          role: supplementary
          analysis_priority: low

          intended_use:
            - cohort_annotation
            - replication_context

        S10:
          name: cancer_risk_associated_tRFQTLs
          title: >
            List of tRFQTLs associated with cancer risk in the
            GWAS meta-analyses

          role: core
          analysis_priority: primary

          expected_columns:
            - Cancer type
            - SNP ID
            - Position (hg19)
            - A1 (effect allele)
            - Effect
            - GWAS P-value

          intended_use:
            - cancer_risk_association
            - prostate_cancer_risk
            - tRF_QTL_GWAS_integration

          cancer_filter:
            primary:
              - PRAD

        S11:
          name: pou2f1_regulated_genes
          title: >
            Details of differentially expressed genes modulated by POU2F1

          role: supplementary
          analysis_priority: low

          expected_columns:
            - Gene ID
            - log2 (Fold Change)
            - P-value

          intended_use:
            - downstream_gene_annotation
            - mechanistic_interpretation

    output:

      s1:
        path: data/interim/trfqtl/s1_survival_trfqtl.parquet
        format: parquet

      s2_all:
        path: data/interim/trfqtl/s2_trfqtl_all.parquet
        format: parquet

      s2_prad:
        path: data/interim/trfqtl/prad_s2_trfqtl.parquet
        format: parquet

      s3:
        path: data/interim/trfqtl/s3_cross_ancestry.parquet
        format: parquet

      s4:
        path: data/interim/trfqtl/s4_immune_infiltration.parquet
        format: parquet

      s5:
        path: data/interim/trfqtl/s5_drug_response.parquet
        format: parquet

      s10_all:
        path: data/interim/trfqtl/s10_cancer_risk_trfqtl.parquet
        format: parquet

      s10_prad:
        path: data/interim/trfqtl/prad_s10_cancer_risk_trfqtl.parquet
        format: parquet

      s11:
        path: data/interim/trfqtl/s11_pou2f1_genes.parquet
        format: parquet

    validation:

      workbook:
        expected_sheet_count: 11

        required_sheets:
          - S1
          - S2
          - S3
          - S4
          - S5
          - S6
          - S7
          - S8
          - S9
          - S10
          - S11

      core_sheets:

        S2:
          required_columns:
            - Cancer type
            - SNP ID
            - SNP position (hg19)
            - Alleles
            - tRF
            - statistic
            - P-value
            - FDR
            - GWAS tagSnp
            - LD (r2)

        S10:
          required_columns:
            - Cancer type
            - SNP ID
            - Position (hg19)
            - A1 (effect allele)
            - Effect
            - GWAS P-value

      checks:
        - valid_snp_identifiers
        - valid_p_values
        - valid_fdr
        - valid_effect_sizes
        - valid_hg19_coordinates
        - non_empty_trf
        - duplicate_snp_trf_detection

    provenance:
      raw_file_must_not_be_modified: true


   # ===========================================================================
  # 3. Moradi Dataset
  # ===========================================================================

  moradi:

    id: moradi_supplementary_dataset

    name: Moradi Supplementary Dataset

    description: >
      Supplementary datasets from the Moradi study containing cis- and
      trans-regulatory QTL associations, splicing QTLs, isoform expression
      QTLs, GWAS-linked regulatory variants, and differential-expression
      results for exon, intron, and transcript isoform features.

    source:
      study: Moradi
      data_type: supplementary_research_data
      access_type: public

    root_path: data/raw/moradi

    genome:
      build: to_be_verified
      coordinate_system: genomic

    files:

      supplementary_s1:
        path: data/raw/moradi/Supplementary Table S1.xlsx
        format: xlsx
        role: core
        analysis_priority: primary

        sheets:

          Cis-intron-retention-sQTL-0.05:
            dataset_type: cis_sQTL
            feature_type: intron_retention

            expected_columns:
              - SNP
              - R
              - A
              - SNP_pos
              - splicing_event
              - Stat
              - p_value
              - FDR
              - beta
              - MAF
              - AvgCall
              - Rsq

          Cis-cassette-exon-sQTL-0.05:
            dataset_type: cis_sQTL
            feature_type: cassette_exon

            expected_columns:
              - SNP
              - R
              - A
              - SNP_pos
              - splicing_event
              - Stat
              - p_value
              - FDR
              - beta
              - MAF
              - AvgCall
              - Rsq

          Cis-iso-eQTL-0.05:
            dataset_type: cis_iso_eQTL
            feature_type: transcript_isoform

            expected_columns:
              - SNP
              - R
              - A
              - SNP_pos
              - splicing_event
              - Stat
              - p_value
              - FDR
              - beta
              - MAF
              - AvgCall
              - Rsq

            identifier_semantics:
              splicing_event: ensembl_transcript_id

        intended_use:
          - cis_sQTL_analysis
          - cis_iso_eQTL_analysis
          - prostate_cancer_regulatory_integration

      supplementary_s2:
        path: data/raw/moradi/Supplementary Table S2.xlsx
        format: xlsx
        role: core
        analysis_priority: primary

        sheets:

          Cis-intron-sQTL-GWAS-LD_0.5:
            dataset_type: cis_sQTL_GWAS_LD
            feature_type: intron_retention

          Cis-exon-sQTL-GWAS-LD_0.5:
            dataset_type: cis_sQTL_GWAS_LD
            feature_type: cassette_exon

          Cis-iso-eQTl-GWAS-LD_0.5:
            dataset_type: cis_iso_eQTL_GWAS_LD
            feature_type: transcript_isoform

        expected_columns:
          - sQTL_SNP
          - sQTL_SNP-pos
          - tag_SNP
          - tag_SNP_pos
          - LD
          - gwas_cancer

        semantic_mapping:
          qtl_coordinate: sQTL_SNP
          qtl_snp_id: sQTL_SNP-pos
          gwas_coordinate: tag_SNP
          gwas_snp_id: tag_SNP_pos
          ld_r2: LD
          cancer_type: gwas_cancer

        source_schema_notes:
          - >
            The source workbook labels coordinate-valued fields as
            sQTL_SNP and tag_SNP, while rsID-valued fields occur in
            sQTL_SNP-pos and tag_SNP_pos.
          - >
            Raw column names must be preserved. Semantic correction is
            performed only in interim normalized datasets.

        intended_use:
          - GWAS_QTL_linkage_analysis
          - prostate_cancer_QTL_filtering
          - regulatory_variant_prioritization
          - cis_iso_eQTL_integration

      supplementary_s3:
        path: data/raw/moradi/Supplementary Table S3.xlsx
        format: xlsx
        role: secondary
        analysis_priority: secondary

        sheets:

          Trans-intron-sQTL:
            dataset_type: trans_sQTL
            feature_type: intron_retention

          Trans-exon-sQTl:
            dataset_type: trans_sQTL
            feature_type: cassette_exon

            source_schema_notes:
              - >
                The source sheet uses column T where SNP is expected.
                The values in this field are dbSNP rs identifiers.

          Trans-iso-eQTL:
            dataset_type: trans_iso_eQTL
            feature_type: transcript_isoform

        expected_common_columns:
          - R
          - A
          - SNP_pos
          - splicing_event
          - Stat
          - p_value
          - FDR
          - beta
          - MAF
          - AvgCall
          - Rsq

        allele_representation:
          supports:
            - snv
            - indel
            - multi_allelic

      supplementary_s4:
        path: data/raw/moradi/Supplementary Table S4.xlsx
        format: xlsx
        role: secondary
        analysis_priority: secondary

        sheets:
          - Trans-intron-sQTL-LD_0.5
          - Trans-exon-sQTL-LD_0.5
          - Trans-iso-eQTL-LD_0.5

        expected_columns:
          - sQTL_SNP
          - sQTL_SNP-pos
          - tag_SNP
          - tag_SNP_pos
          - LD
          - gwas_cancer

        semantic_mapping:
          qtl_coordinate: sQTL_SNP
          qtl_snp_id: sQTL_SNP-pos
          gwas_coordinate: tag_SNP
          gwas_snp_id: tag_SNP_pos
          ld_r2: LD
          cancer_type: gwas_cancer

        source_schema_notes:
          - >
            The same coordinate/rsID header inversion observed in
            Supplementary Table S2 is present in this workbook.
          - >
            Some tag_SNP_pos values contain multiple rsIDs separated
            by a colon and must not be validated as a single rsID.

      de_ep_cis:
        path: data/raw/moradi/Supplementary Table S5_DE_EP_cis.csv
        format: csv
        role: differential_expression
        analysis_priority: secondary
        association_type: cis
        feature_type: exon

      de_ep_trans:
        path: data/raw/moradi/Supplementary Table S6_DE_EP_trans.csv
        format: csv
        role: differential_expression
        analysis_priority: secondary
        association_type: trans
        feature_type: exon

      de_int_cis:
        path: data/raw/moradi/Supplementary Table S7_DE_INT_cis.csv
        format: csv
        role: differential_expression
        analysis_priority: secondary
        association_type: cis
        feature_type: intron

      de_int_trans:
        path: data/raw/moradi/Supplementary Table S8_DE_INT_trans.csv
        format: csv
        role: differential_expression
        analysis_priority: secondary
        association_type: trans
        feature_type: intron

      de_isoform_cis:
        path: data/raw/moradi/Supplementary Table S9_DE_Isoform_cis.csv
        format: csv
        role: differential_expression
        analysis_priority: secondary
        association_type: cis
        feature_type: transcript_isoform

        intended_use:
          - isoform_differential_expression
          - biological_interpretation
          - regulatory_target_prioritization

      de_isoform_trans:
        path: data/raw/moradi/Supplementary Table S10_DE_Isoform_trans_cancer_vs_control.csv
        format: csv
        role: differential_expression
        analysis_priority: secondary
        association_type: trans
        feature_type: transcript_isoform

        intended_use:
          - isoform_differential_expression
          - cancer_vs_control_comparison
          - biological_interpretation

    differential_expression_schema:

      expected_columns:
        - Unnamed: 0
        - baseMean
        - log2FoldChange
        - lfcSE
        - stat
        - pvalue
        - padj

      identifier_column:
        source_name: "Unnamed: 0"

      statistical_columns:
        p_value: pvalue
        adjusted_p_value: padj
        effect_size: log2FoldChange

    output:

      cis_intron_sqtl:
        path: data/interim/moradi/cis_intron_sqtl.parquet
        format: parquet

      cis_exon_sqtl:
        path: data/interim/moradi/cis_exon_sqtl.parquet
        format: parquet

      cis_iso_eqtl:
        path: data/interim/moradi/cis_iso_eqtl.parquet
        format: parquet

      cis_intron_gwas_ld:
        path: data/interim/moradi/cis_intron_gwas_ld.parquet
        format: parquet

      cis_exon_gwas_ld:
        path: data/interim/moradi/cis_exon_gwas_ld.parquet
        format: parquet

      cis_iso_gwas_ld:
        path: data/interim/moradi/cis_iso_gwas_ld.parquet
        format: parquet

      de_ep_cis:
        path: data/interim/moradi/de_ep_cis.parquet
        format: parquet

      de_ep_trans:
        path: data/interim/moradi/de_ep_trans.parquet
        format: parquet

      de_int_cis:
        path: data/interim/moradi/de_int_cis.parquet
        format: parquet

      de_int_trans:
        path: data/interim/moradi/de_int_trans.parquet
        format: parquet

      de_isoform_cis:
        path: data/interim/moradi/de_isoform_cis.parquet
        format: parquet

      de_isoform_trans:
        path: data/interim/moradi/de_isoform_trans.parquet
        format: parquet

    validation:

      required_files:
        - Supplementary Table S1.xlsx
        - Supplementary Table S2.xlsx
        - Supplementary Table S3.xlsx
        - Supplementary Table S4.xlsx
        - Supplementary Table S5_DE_EP_cis.csv
        - Supplementary Table S6_DE_EP_trans.csv
        - Supplementary Table S7_DE_INT_cis.csv
        - Supplementary Table S8_DE_INT_trans.csv
        - Supplementary Table S9_DE_Isoform_cis.csv
        - Supplementary Table S10_DE_Isoform_trans_cancer_vs_control.csv

      core_qtl_checks:
        - valid_snp_identifiers
        - valid_genomic_coordinates
        - valid_allele_representation
        - valid_splicing_event_identifiers
        - valid_transcript_identifiers
        - valid_p_values
        - valid_fdr
        - valid_maf
        - valid_call_rate
        - valid_rsq
        - valid_numeric_statistics
        - duplicate_detection

      gwas_ld_checks:
        - valid_qtl_coordinates
        - valid_qtl_snp_identifiers
        - valid_gwas_coordinates
        - valid_gwas_snp_identifiers
        - valid_ld_r2
        - non_empty_cancer_type

      differential_expression_checks:
        - non_empty_feature_identifier
        - valid_base_mean
        - valid_log2_fold_change
        - valid_lfc_se
        - valid_statistic
        - valid_p_values
        - valid_adjusted_p_values
        - duplicate_detection

    provenance:
      raw_files_must_not_be_modified: true

    important_note: >
      Genome build, association-model details, statistical thresholds,
      and experimental design must be verified from the original Moradi
      publication and supplementary documentation before genome
      harmonization or causal interpretation.


# =============================================================================
# Cross-Dataset Integration Metadata
# =============================================================================

integration:

  primary_disease:
    name: Prostate cancer
    tcga_code: PRAD

  primary_analysis:

    tRF_QTL:
      source: cancer_trfqtl
      sheets:
        - S2
        - S10
      cancer_type: PRAD

    gwas:
      source: gwas_catalog
      trait:
        - Prostate cancer

    isoform_qtl:
      source: moradi

      primary:
        workbook: supplementary_s1
        sheet: Cis-iso-eQTL-0.05

      gwas_linked:
        workbook: supplementary_s2
        sheet: Cis-iso-eQTl-GWAS-LD_0.5

      cancer_type:
        - prostate_cancer

    isoform_expression:
      source: moradi

      supporting_datasets:
        - de_isoform_cis
        - de_isoform_trans

  genomic_harmonization:

    reference_build:
      trfqtl: hg19
      gwas_catalog: source_dependent
      moradi: to_be_verified

    liftover:
      enabled: false
      target_build: hg38
      stage: future_harmonization

  identifiers:

    snp:
      primary:
        - rsID

    chromosome:
      canonical_format: chrN

    trf:
      preserve_source_identifier: true

    gene:
      preferred_identifier_system: Ensembl

    transcript:
      preferred_identifier_system: Ensembl


# =============================================================================
# Data Processing Policy
# =============================================================================

processing:

  raw:
    immutable: true
    modification_allowed: false

  interim:
    purpose: standardized_dataset
    format: parquet

  processed:
    purpose: analysis_ready_dataset
    format: parquet

  transformations:

    allowed:
      - column_name_standardization
      - datatype_conversion
      - missing_value_normalization
      - identifier_normalization
      - duplicate_detection
      - disease_filtering
      - genome_coordinate_standardization

    prohibited_in_raw:
      - row_deletion
      - value_correction
      - manual_editing
      - genome_liftover
      - statistical_filtering


# =============================================================================
# Quality Control
# =============================================================================

quality_control:

  general:

    checks:
      - file_exists
      - file_readable
      - schema_validation
      - missingness
      - duplicate_records
      - datatype_validation

  genomic:

    checks:
      - valid_rsID
      - valid_chromosome
      - valid_position
      - genome_build_consistency

  statistics:

    p_value:
      minimum: 0.0
      maximum: 1.0

    fdr:
      minimum: 0.0
      maximum: 1.0

  output:

    report_directory: data/interim/qc

    format:
      - json
      - csv


# =============================================================================
# Reproducibility
# =============================================================================

reproducibility:

  record_download_date: true
  record_source_url: true
  record_file_checksum: true
  record_file_size: true

  checksum:
    algorithm: SHA256

  software:
    python: "3.12"

  raw_data_policy:
    preserve_original_filename: true
    preserve_original_format: true