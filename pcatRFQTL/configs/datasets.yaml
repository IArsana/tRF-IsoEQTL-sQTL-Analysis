# =============================================================================
# Cross-Dataset Integration Metadata
# =============================================================================

integration:

  primary_disease:

    id: prostate_cancer
    name: Prostate cancer
    tcga_code: PRAD

    aliases:
      - PRAD
      - PrCa
      - Prostate cancer
      - prostate cancer
      - prostate carcinoma
      - prostate_cancer

    harmonization:
      annotation_first: true
      filter_during_harmonization: false
      filter_during_analysis_ready_generation: true

  primary_analysis:

    trf_qtl:
      source: cancer_trfqtl

      sheets:
        - S2
        - S10

      cancer_type: PRAD

    gwas:
      source: gwas_catalog

      trait:
        - Prostate cancer

    isoform_qtl:
      source: moradi

      primary:
        workbook: supplementary_s1
        sheet: Cis-iso-eQTL-0.05

      gwas_linked:
        workbook: supplementary_s2
        sheet: Cis-iso-eQTl-GWAS-LD_0.5

      cancer_type:
        - prostate_cancer

    splicing_qtl:
      source: moradi

      feature_types:
        - intron_retention
        - cassette_exon

    isoform_expression:
      source: moradi

      supporting_datasets:
        - de_isoform_cis
        - de_isoform_trans


  # ===========================================================================
  # M3.1 Genome-Build Verification
  # ===========================================================================

  genomic_harmonization:

    reference_build:

      trfqtl:
        build: hg19
        assembly: GRCh37
        status: verified

      moradi:
        build: hg19
        assembly: GRCh37
        status: verified

      gwas_catalog:
        build: source_dependent
        assembly: source_dependent
        status: source_dependent

    coordinate_compatibility:

      cancer_trfqtl_moradi:
        compatible: true
        reason: >
          Both datasets use verified hg19 / GRCh37 genomic coordinates.

      cancer_trfqtl_gwas_catalog:
        compatible: false
        reason: >
          GWAS Catalog coordinate build has not yet been resolved for
          direct hg19 coordinate-level matching.

      moradi_gwas_catalog:
        compatible: false
        reason: >
          GWAS Catalog coordinate build has not yet been resolved for
          direct hg19 coordinate-level matching.

    target_build:
      build: hg38
      assembly: GRCh38

    liftover:
      enabled: false
      target_build: hg38
      target_assembly: GRCh38
      stage: future_harmonization

      policy:
        preserve_original_coordinate: true
        require_verified_source_build: true
        prohibit_unverified_liftover: true

    m3_1_status:
      cancer_trfqtl: verified
      moradi: verified
      gwas_catalog: unresolved


  # ===========================================================================
  # Identifier Harmonization Policy
  # ===========================================================================

  identifiers:

    variant:

      rsid:
        canonical_pattern: "^rs[0-9]+$"
        preferred_for_cross_source_matching: true

      coordinate:
        canonical_format: "chrN:position"
        require_verified_genome_build: true

      matching_priority:
        - canonical_rsid
        - verified_genomic_coordinate

    chromosome:
      canonical_format: chrN

    trf:
      preserve_source_identifier: true

    gene:
      preferred_identifier_system: Ensembl

    transcript:
      preferred_identifier_system: Ensembl
      preserve_version: true

    splicing_event:
      preserve_source_identifier: true


# =============================================================================
# Data Processing Policy
# =============================================================================

processing:

  raw:
    immutable: true
    modification_allowed: false

  standardized:
    purpose: source_consistent_representation
    directory: data/interim/standardized
    format: parquet

  harmonized:
    purpose: cross_source_comparable_representation
    directory: data/interim/harmonized
    format: parquet

  processed:
    purpose: analysis_ready_dataset
    directory: data/processed
    format: parquet

  transformations:

    standardization:

      allowed:
        - datatype_conversion
        - missing_value_normalization
        - identifier_normalization
        - coordinate_string_standardization
        - source_schema_semantic_mapping
        - anomaly_annotation

      prohibited:
        - genome_liftover
        - disease_filtering
        - cross_source_join
        - source_value_correction
        - row_deletion

    harmonization:

      allowed:
        - genome_build_annotation
        - coordinate_compatibility_assessment
        - variant_identity_harmonization
        - feature_identifier_harmonization
        - disease_context_harmonization
        - genome_liftover_after_verification

      prohibited_without_verified_build:
        - coordinate_join
        - genome_liftover

    prohibited_in_raw:
      - row_deletion
      - value_correction
      - manual_editing
      - genome_liftover
      - statistical_filtering


# =============================================================================
# Quality Control
# =============================================================================

quality_control:

  general:

    checks:
      - file_exists
      - file_readable
      - schema_validation
      - missingness
      - duplicate_records
      - datatype_validation
      - row_cardinality_preservation

  genomic:

    checks:
      - valid_rsid
      - valid_chromosome
      - valid_position
      - genome_build_consistency
      - coordinate_join_compatibility

  statistics:

    p_value:
      minimum: 0.0
      maximum: 1.0

    fdr:
      minimum: 0.0
      maximum: 1.0

    ld_r2:
      minimum: 0.0
      maximum: 1.0

  outputs:

    validation:
      directory: data/interim/qc

    standardization:
      path: data/interim/standardized/qc/standardization_summary.json

    harmonization:
      directory: data/interim/harmonized/qc

    formats:
      - json
      - csv


# =============================================================================
# Reproducibility
# =============================================================================

reproducibility:

  record_download_date: true
  record_source_url: true
  record_file_checksum: true
  record_file_size: true

  checksum:
    algorithm: SHA256

  software:
    python: "3.12"

  raw_data_policy:
    preserve_original_filename: true
    preserve_original_format: true