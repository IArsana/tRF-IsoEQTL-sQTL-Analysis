# =============================================================================
# Dataset Configuration
# =============================================================================
#
# Project:
#   pcatRFQTL
#
# Purpose:
#   Central registry for all source datasets, standardized outputs,
#   integration metadata, genome-build provenance, and data-processing
#   policies used in the prostate cancer tRF-QTL / isoform-QTL /
#   splicing-QTL integrative analysis.
#
# Author:
#   I Putu Indra Arsana
#
# Project Title:
#   Integrative Analysis of Prostate Cancer Risk Variants,
#   tRNA-Derived Fragment QTLs, and Transcript Isoform Regulation
#
# License:
#   MIT
#
# Data policy:
#   - Raw datasets are immutable.
#   - File paths are relative to the project root.
#   - Source-specific schema quirks must be documented, not silently corrected.
#   - Standardization operates on source representation without liftover.
#   - Cross-source genome harmonization is performed only during M3.
#
# =============================================================================


project:
  name: pcatRFQTL

  description: >
    Integrative analysis of prostate cancer genetic risk variants,
    tRNA-derived fragment quantitative trait loci, splicing QTLs,
    transcript isoform QTLs, and isoform-level regulatory associations.

  author:
    name: I Putu Indra Arsana

  data_policy:
    raw_data_immutable: true
    relative_paths: true
    preserve_source_schema: true
    preserve_source_anomalies: true


# =============================================================================
# Directory Configuration
# =============================================================================

directories:

  raw:
    path: data/raw

  interim:
    path: data/interim

  standardized:
    path: data/interim/standardized

  harmonized:
    path: data/interim/harmonized

  processed:
    path: data/processed

  qc:
    path: data/interim/qc


# =============================================================================
# Dataset Registry
# =============================================================================

datasets:

  # ===========================================================================
  # 1. GWAS Catalog
  # ===========================================================================

  gwas_catalog:

    id: gwas_catalog_associations

    name: GWAS Catalog Association Dataset

    description: >
      Full GWAS Catalog association dataset containing published
      genome-wide association study associations. The dataset is used
      to identify prostate cancer-associated genetic variants and to
      support downstream overlap with tRF-QTL, splicing-QTL, and
      isoform-QTL regulatory loci.

    source:
      organization: NHGRI-EBI GWAS Catalog
      database: GWAS Catalog
      data_type: gwas_association_summary
      access_type: public

    files:

      associations:
        path: data/raw/gwas/gwas-catalog-download-associations-alt-full.tsv
        format: tsv
        compression: none

    genome:
      build: source_dependent
      assembly: source_dependent
      verification_status: source_dependent
      coordinate_system: catalog_mapped_coordinates

      coordinate_join_allowed: false

      note: >
        GWAS Catalog coordinates are retained as source-dependent during
        M3.1. Coordinate-level matching against verified hg19 datasets
        is not permitted until the coordinate convention is explicitly
        resolved.

    primary_key:
      - study_accession
      - variant_descriptor

    expected_core_fields:
      - STUDY ACCESSION
      - PUBMEDID
      - DISEASE/TRAIT
      - MAPPED_TRAIT
      - SNPS
      - CHR_ID
      - CHR_POS
      - STRONGEST SNP-RISK ALLELE
      - P-VALUE
      - PVALUE_MLOG
      - MAPPED_GENE
      - REPORTED GENE(S)

    intended_use:
      - prostate_cancer_gwas_filtering
      - variant_annotation
      - cancer_risk_association
      - trf_qtl_overlap
      - isoform_qtl_overlap
      - splicing_qtl_overlap
      - genomic_locus_annotation

    filtering:

      primary_trait:
        - Prostate cancer

    standardization:

      output_directory:
        path: data/interim/standardized/gwas_catalog
        format: parquet_dataset

      partition_pattern:
        value: part-*.parquet

      chunk_size:
        default: 100000

      p_value_policy:
        preserve_reported_p_value: true
        use_pvalue_mlog_for_zero_values: true
        arbitrary_zero_replacement: false

    validation:

      required_columns:
        - SNPS
        - P-VALUE

      coordinate_columns:
        - CHR_ID
        - CHR_POS

      optional_columns:
        - PUBMEDID
        - FIRST AUTHOR
        - STUDY
        - DISEASE/TRAIT
        - MAPPED_GENE
        - STRONGEST SNP-RISK ALLELE
        - RISK ALLELE FREQUENCY
        - OR or BETA
        - PVALUE_MLOG
        - STUDY ACCESSION

      checks:
        - valid_p_values
        - valid_variant_descriptors
        - genomic_coordinate_consistency
        - missing_coordinate_detection
        - duplicate_detection

    provenance:
      raw_file_must_not_be_modified: true


  # ===========================================================================
  # 2. Cancer-tRFQTL
  # ===========================================================================

  cancer_trfqtl:

    id: cancer_trfqtl_supplementary

    name: Cancer-tRFQTL Supplementary Dataset

    description: >
      Supplementary data from the Cancer-tRFQTL study containing
      pan-cancer tRNA-derived fragment quantitative trait loci,
      GWAS-associated tRFQTLs, survival-associated tRFQTLs,
      immune infiltration associations, drug-response associations,
      cross-ancestry GWAS meta-analysis information,
      cancer-risk-associated tRFQTLs, cohort characteristics,
      experimental sequences, and POU2F1-regulated genes.

    source:
      study: Cancer-tRFQTL
      publication_identifier: can-25-1282
      data_type: supplementary_research_data
      access_type: public

    genome:
      build: hg19
      assembly: GRCh37
      verification_status: verified
      coordinate_system: chromosome_position

      coordinate_join_allowed: true

      evidence: >
        Cancer-tRFQTL supplementary tables explicitly report SNP
        genomic positions using hg19 coordinates.

    files:

      workbook:
        path: data/raw/trfqtl/can-25-1282_supplementary_data_suppst1-11.xlsx
        format: xlsx

        expected_sheets:
          - S1
          - S2
          - S3
          - S4
          - S5
          - S6
          - S7
          - S8
          - S9
          - S10
          - S11

        sheets:

          S1:
            title: Survival-associated tRFQTLs
            role: secondary
            header_row: 1

          S2:
            title: GWAS-associated tRFQTLs
            role: primary
            header_row: 1

          S3:
            title: Cross-ancestry genome-wide meta-analysis
            role: metadata
            header_row: 1

          S4:
            title: tRF-immune infiltration associations
            role: secondary
            header_row: 1

          S5:
            title: tRF-drug response associations
            role: secondary
            header_row: 1

          S6:
            title: Chinese population characteristics
            role: metadata
            header_row: 1

          S7:
            title: Probe or primer sequences
            role: metadata
            header_row: 1

          S8:
            title: UK Biobank characteristics
            role: metadata
            header_row: 1

          S9:
            title: PLCO cohort characteristics
            role: metadata
            header_row: 1

          S10:
            title: Cancer-risk-associated tRFQTLs
            role: primary
            header_row: 1

          S11:
            title: POU2F1-regulated differentially expressed genes
            role: secondary
            header_row: 1

    workbook:

      number_of_sheets: 11

      sheets:

        S1:
          name: survival_associated_trfqtl
          feature_type: trf
          role: supplementary
          analysis_priority: secondary

        S2:
          name: gwas_associated_trfqtl
          feature_type: trf
          role: core
          analysis_priority: primary

          expected_columns:
            - Cancer type
            - SNP ID
            - SNP position (hg19)
            - Alleles
            - tRF
            - statistic
            - P-value
            - FDR
            - GWAS tagSnp
            - LD (r2)

          intended_use:
            - trf_qtl_analysis
            - prostate_cancer_filtering
            - gwas_trfqtl_integration
            - ld_analysis

          cancer_filter:
            primary:
              - PRAD

        S3:
          name: cross_ancestry_gwas_meta_analysis
          role: supplementary
          analysis_priority: secondary

        S4:
          name: trf_immune_infiltration
          role: supplementary
          analysis_priority: secondary

        S5:
          name: trf_drug_response
          role: supplementary
          analysis_priority: secondary

        S6:
          name: chinese_cohort_characteristics
          role: supplementary
          analysis_priority: low

        S7:
          name: probe_primer_sequences
          role: supplementary
          analysis_priority: low

        S8:
          name: uk_biobank_characteristics
          role: supplementary
          analysis_priority: low

        S9:
          name: plco_cohort_characteristics
          role: supplementary
          analysis_priority: low

        S10:
          name: cancer_risk_associated_trfqtl
          feature_type: trf
          role: core
          analysis_priority: primary

          expected_columns:
            - Cancer type
            - SNP ID
            - Position (hg19)
            - A1 (effect allele)
            - Effect
            - GWAS P-value

          intended_use:
            - cancer_risk_association
            - prostate_cancer_risk
            - trf_qtl_gwas_integration

          cancer_filter:
            primary:
              - PRAD

        S11:
          name: pou2f1_regulated_genes
          role: supplementary
          analysis_priority: low

    source_anomalies:

      s10_non_rsid_variant:
        raw_value: "6"
        coordinate: "6:28958399"
        classification: source
        severity: warning

        standardization_policy:
          preserve_raw_value: true
          canonical_rsid: null
          coordinate_remains_usable: true
          exclude_from_rsid_only_analysis: true

    standardization:

      output_directory:
        path: data/interim/standardized/cancer_trfqtl

      outputs:

        S2:
          path: data/interim/standardized/cancer_trfqtl/s2.parquet
          format: parquet

        S10:
          path: data/interim/standardized/cancer_trfqtl/s10.parquet
          format: parquet

      genome_build:
        value: hg19

      prostate_cancer_filtering:
        performed_during_standardization: false

    validation:

      workbook:
        expected_sheet_count: 11

        required_sheets:
          - S1
          - S2
          - S3
          - S4
          - S5
          - S6
          - S7
          - S8
          - S9
          - S10
          - S11

      core_sheets:

        S2:
          required_columns:
            - Cancer type
            - SNP ID
            - SNP position (hg19)
            - Alleles
            - tRF
            - statistic
            - P-value
            - FDR
            - GWAS tagSnp
            - LD (r2)

        S10:
          required_columns:
            - Cancer type
            - SNP ID
            - Position (hg19)
            - A1 (effect allele)
            - Effect
            - GWAS P-value

      checks:
        - valid_snp_identifiers
        - valid_p_values
        - valid_fdr
        - valid_effect_sizes
        - valid_hg19_coordinates
        - non_empty_trf
        - duplicate_detection

    provenance:
      raw_file_must_not_be_modified: true


  # ===========================================================================
  # 3. Moradi Dataset
  # ===========================================================================

  moradi:

    id: moradi_supplementary_dataset

    name: Moradi Supplementary Dataset

    description: >
      Supplementary datasets from the Moradi study containing cis-
      and trans-regulatory QTL associations, splicing QTLs,
      isoform expression QTLs, GWAS-linked regulatory variants,
      and differential-expression results for exon, intron,
      and transcript isoform features.

    source:
      study: Moradi
      data_type: supplementary_research_data
      access_type: public

    root_path: data/raw/moradi

    genome:
      build: hg19
      assembly: GRCh37
      verification_status: verified
      coordinate_system: chromosome_position
      coordinate_join_allowed: true

      evidence: >
        The Moradi publication states that every sQTL and iso-eQTL
        table reports SNP genomic position in hg19.

      scope: >
        Genome-build assignment applies to SNP genomic positions
        represented in supplementary QTL tables S1-S4.

    files:

      supplementary_s1:
        path: data/raw/moradi/Supplementary Table S1.xlsx
        format: xlsx
        role: core
        analysis_priority: primary

        sheets:

          Cis-intron-retention-sQTL-0.05:
            dataset_type: cis_sQTL
            feature_type: intron_retention

          Cis-cassette-exon-sQTL-0.05:
            dataset_type: cis_sQTL
            feature_type: cassette_exon

          Cis-iso-eQTL-0.05:
            dataset_type: cis_iso_eQTL
            feature_type: transcript_isoform

            identifier_semantics:
              splicing_event: ensembl_transcript_id

        expected_columns:
          - SNP
          - R
          - A
          - SNP_pos
          - splicing_event
          - Stat
          - p_value
          - FDR
          - beta
          - MAF
          - AvgCall
          - Rsq

        intended_use:
          - cis_sqtl_analysis
          - cis_iso_eqtl_analysis
          - prostate_cancer_regulatory_integration

      supplementary_s2:
        path: data/raw/moradi/Supplementary Table S2.xlsx
        format: xlsx
        role: core
        analysis_priority: primary

        sheets:

          Cis-intron-sQTL-GWAS-LD_0.5:
            dataset_type: cis_sQTL_GWAS_LD
            feature_type: intron_retention
            feature_column: splicing_event

          Cis-exon-sQTL-GWAS-LD_0.5:
            dataset_type: cis_sQTL_GWAS_LD
            feature_type: cassette_exon
            feature_column: splicing_event

          Cis-iso-eQTl-GWAS-LD_0.5:
            dataset_type: cis_iso_eQTL_GWAS_LD
            feature_type: transcript_isoform
            feature_column: mRNA_isoform

        expected_columns:
          - sQTL_SNP
          - sQTL_SNP-pos
          - tag_SNP
          - tag_SNP_pos
          - LD
          - gwas_cancer

        semantic_mapping:
          qtl_coordinate: sQTL_SNP
          qtl_snp_id: sQTL_SNP-pos
          gwas_coordinate: tag_SNP
          gwas_snp_id: tag_SNP_pos
          ld_r2: LD
          cancer_type: gwas_cancer

        source_schema_notes:

          - >
            The source workbook labels coordinate-valued fields as
            sQTL_SNP and tag_SNP, while rsID-valued fields occur in
            sQTL_SNP-pos and tag_SNP_pos.

          - >
            Raw column names are preserved. Semantic interpretation
            occurs only in validated and standardized representations.

          - >
            tag_SNP_pos may contain multiple colon-separated rsIDs.

        intended_use:
          - gwas_qtl_linkage_analysis
          - prostate_cancer_qtl_filtering
          - regulatory_variant_prioritization
          - cis_iso_eqtl_integration

      supplementary_s3:
        path: data/raw/moradi/Supplementary Table S3.xlsx
        format: xlsx
        role: secondary
        analysis_priority: secondary

        sheets:

          Trans-intron-sQTL:
            dataset_type: trans_sQTL
            feature_type: intron_retention
            variant_column: SNP
            feature_column: splicing_event

          Trans-exon-sQTl:
            dataset_type: trans_sQTL
            feature_type: cassette_exon
            variant_column: T
            feature_column: splicing_event

            source_schema_notes:
              - >
                The source sheet uses column T where SNP is expected.
                Values in this field are dbSNP rs identifiers.

          Trans-iso-eQTL:
            dataset_type: trans_iso_eQTL
            feature_type: transcript_isoform
            variant_column: SNP
            feature_column: splicing_event

            identifier_semantics:
              splicing_event: ensembl_transcript_id

        expected_common_columns:
          - R
          - A
          - SNP_pos
          - splicing_event
          - Stat
          - p_value
          - FDR
          - beta
          - MAF
          - AvgCall
          - Rsq

        allele_representation:
          supports:
            - snv
            - indel
            - multi_allelic

      supplementary_s4:
        path: data/raw/moradi/Supplementary Table S4.xlsx
        format: xlsx
        role: secondary
        analysis_priority: secondary

        sheets:

          Trans-intron-sQTL-LD_0.5:
            dataset_type: trans_qtl_gwas_ld
            feature_type: transcript_isoform
            feature_column: mRNA_isoform

          Trans-exon-sQTL-LD_0.5:
            dataset_type: trans_qtl_gwas_ld
            feature_type: cassette_exon
            feature_column: splicing_event

          Trans-iso-eQTL-LD_0.5:
            dataset_type: trans_qtl_gwas_ld
            feature_type: intron_retention
            feature_column: splicing_event

        expected_columns:
          - sQTL_SNP
          - sQTL_SNP-pos
          - tag_SNP
          - tag_SNP_pos
          - LD
          - gwas_cancer

        semantic_mapping:
          qtl_coordinate: sQTL_SNP
          qtl_snp_id: sQTL_SNP-pos
          gwas_coordinate: tag_SNP
          gwas_snp_id: tag_SNP_pos
          ld_r2: LD
          cancer_type: gwas_cancer

        source_schema_notes:

          - >
            The same coordinate/rsID header inversion observed in
            Supplementary Table S2 is present in this workbook.

          - >
            Some tag_SNP_pos values contain multiple rsIDs separated
            by a colon.

          - >
            Source sheet labels do not always match the semantic type
            of the feature column. Harmonization therefore follows
            observed source values rather than sheet names alone.

      de_ep_cis:
        path: data/raw/moradi/Supplementary Table S5_DE_EP_cis.csv
        format: csv
        role: differential_expression
        association_type: cis
        feature_type: exon

      de_ep_trans:
        path: data/raw/moradi/Supplementary Table S6_DE_EP_trans.csv
        format: csv
        role: differential_expression
        association_type: trans
        feature_type: exon

      de_int_cis:
        path: data/raw/moradi/Supplementary Table S7_DE_INT_cis.csv
        format: csv
        role: differential_expression
        association_type: cis
        feature_type: intron

      de_int_trans:
        path: data/raw/moradi/Supplementary Table S8_DE_INT_trans.csv
        format: csv
        role: differential_expression
        association_type: trans
        feature_type: intron

      de_isoform_cis:
        path: data/raw/moradi/Supplementary Table S9_DE_Isoform_cis.csv
        format: csv
        role: differential_expression
        association_type: cis
        feature_type: transcript_isoform

      de_isoform_trans:
        path: data/raw/moradi/Supplementary Table S10_DE_Isoform_trans_cancer_vs_control.csv
        format: csv
        role: differential_expression
        association_type: trans
        feature_type: transcript_isoform

    differential_expression_schema:

      expected_columns:
        - Unnamed: 0
        - baseMean
        - log2FoldChange
        - lfcSE
        - stat
        - pvalue
        - padj

      identifier_column:
        source_name: "Unnamed: 0"

      statistical_columns:
        p_value: pvalue
        adjusted_p_value: padj
        effect_size: log2FoldChange

    source_anomalies:

      malformed_intron_identifier:
        raw_value: INT1e+05
        classification: source
        severity: warning

        policy:
          preserve_raw_value: true
          canonical_feature_id: null
          exclude_from_canonical_feature_id_analysis: true
          do_not_auto_correct: true

    standardization:

      output_directory:
        path: data/interim/standardized/moradi_qtl

      qtl_outputs:

        s1_cis_intron:
          path: data/interim/standardized/moradi_qtl/s1_cis_intron.parquet

        s1_cis_exon:
          path: data/interim/standardized/moradi_qtl/s1_cis_exon.parquet

        s1_cis_isoform:
          path: data/interim/standardized/moradi_qtl/s1_cis_isoform.parquet

        s2_cis_intron:
          path: data/interim/standardized/moradi_qtl/s2_cis_intron.parquet

        s2_cis_exon:
          path: data/interim/standardized/moradi_qtl/s2_cis_exon.parquet

        s2_cis_isoform:
          path: data/interim/standardized/moradi_qtl/s2_cis_isoform.parquet

        s3_trans_intron:
          path: data/interim/standardized/moradi_qtl/s3_trans_intron.parquet

        s3_trans_exon:
          path: data/interim/standardized/moradi_qtl/s3_trans_exon.parquet

        s3_trans_isoform:
          path: data/interim/standardized/moradi_qtl/s3_trans_isoform.parquet

        s4_trans_intron:
          path: data/interim/standardized/moradi_qtl/s4_trans_intron.parquet

        s4_trans_exon:
          path: data/interim/standardized/moradi_qtl/s4_trans_exon.parquet

        s4_trans_isoform:
          path: data/interim/standardized/moradi_qtl/s4_trans_isoform.parquet

      differential_expression_output_directory:
        path: data/interim/standardized/moradi_de

      differential_expression_outputs:

        S5:
          path: data/interim/standardized/moradi_de/s5.parquet

        S6:
          path: data/interim/standardized/moradi_de/s6.parquet

        S7:
          path: data/interim/standardized/moradi_de/s7.parquet

        S8:
          path: data/interim/standardized/moradi_de/s8.parquet

        S9:
          path: data/interim/standardized/moradi_de/s9.parquet

        S10:
          path: data/interim/standardized/moradi_de/s10.parquet

    validation:

      required_files:
        - Supplementary Table S1.xlsx
        - Supplementary Table S2.xlsx
        - Supplementary Table S3.xlsx
        - Supplementary Table S4.xlsx
        - Supplementary Table S5_DE_EP_cis.csv
        - Supplementary Table S6_DE_EP_trans.csv
        - Supplementary Table S7_DE_INT_cis.csv
        - Supplementary Table S8_DE_INT_trans.csv
        - Supplementary Table S9_DE_Isoform_cis.csv
        - Supplementary Table S10_DE_Isoform_trans_cancer_vs_control.csv

      core_qtl_checks:
        - valid_snp_identifiers
        - valid_genomic_coordinates
        - valid_allele_representation
        - valid_splicing_event_identifiers
        - valid_transcript_identifiers
        - valid_p_values
        - valid_fdr
        - valid_maf
        - valid_call_rate
        - valid_rsq
        - valid_numeric_statistics
        - duplicate_detection

      gwas_ld_checks:
        - valid_qtl_coordinates
        - valid_qtl_snp_identifiers
        - valid_gwas_coordinates
        - valid_gwas_snp_identifiers
        - valid_ld_r2
        - non_empty_cancer_type

      differential_expression_checks:
        - non_empty_feature_identifier
        - valid_base_mean
        - valid_log2_fold_change
        - valid_lfc_se
        - valid_statistic
        - valid_p_values
        - valid_adjusted_p_values
        - duplicate_detection

    provenance:
      raw_files_must_not_be_modified: true

# ===========================================================================
  # 4. M7 External Small-RNA Validation Datasets
  # ===========================================================================

  m7_gse80400:

    id: gse80400

    name: GSE80400 Prostate Cancer Small-RNA Sequencing Dataset

    description: >
      Public human prostate cancer small/non-coding RNA sequencing dataset
      selected as a candidate external validation resource for direct
      sequence-level assessment of the prioritized tRF candidate. The study
      reports tRNA-derived small RNA species and provides a public raw
      sequencing route through SRA.

    source:
      organization: NCBI
      database: GEO
      accession: GSE80400
      bioproject: PRJNA318802
      sra_study: SRP073456
      data_type: small_rna_sequencing
      access_type: public

      source_url:
        https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE80400

    organism:
      species: Homo sapiens
      taxon_id: 9606

    disease:
      primary: prostate cancer

    experiment:

      experiment_type:
        non_coding_rna_profiling_by_high_throughput_sequencing

      library_scope:
        small_non_coding_rna

      small_rna_library: true

      trna_derived_rna_reported: true

      raw_sequence_available: true

      raw_sequence_repository: SRA

      raw_sequence_access_type: public

      technical_eligibility_verified: false

      candidate_sequence_search_performed: false

      candidate_trf_quantification_performed: false

    cohort:

      sample_count_series: 11

      patient_count_reported: null

      prostate_tissue: true

      tumor_samples_present: true

      normal_or_benign_samples_present: true

      adjacent_normal_samples_present: false

      benign_samples_present: true

      clinical_metadata_reported: true

      biochemical_recurrence_metadata_reported: false

      multiple_disease_stages_reported: false

      ffpe: false

    sequencing:

      platform: GPL9052

      instrument: Illumina Genome Analyzer

      size_fractionated_library_reported: true

      read_length_compatibility_verified: false

      adapter_information_verified: false

      read_structure_verified: false

    intended_use:

      - external_trf_validation
      - public_small_rna_dataset_discovery
      - candidate_sequence_quantification_feasibility
      - prostate_cancer_small_rna_validation

    m7:

      discovery_stage:
        milestone: M7.4A
        discovery_eligible: true

      technical_audit_stage:
        milestone: M7.4B
