  trf_id:
    "tRF-24-S3M8309N0Y"

  exact_sequence:
    "GTAGTCGTGGCCGAGTGGTTAAGG"

  sequence_length_nt:
    24

  sequence_source_supported:
    true


# ============================================================================
# Technical eligibility criteria
#
# M7.4B determines whether raw sequence data are technically suitable for
# exact-sequence auditing in M7.4C.
#
# It does NOT establish that the candidate is actually present.
# ============================================================================

technical_criteria:

  require_public_raw_sequence:
    true

  require_small_rna_or_ncrna_library:
    true

  require_size_fractionation_or_explicit_small_rna_protocol:
    true

  require_candidate_length_compatible:
    true

  require_read_orientation_resolvable:
    true

  require_adapter_handling_resolvable:
    true


# ============================================================================
# Technical evidence audit
#
# These fields record what has been established from public source metadata.
# They do NOT report candidate detection.
# ============================================================================

dataset_audit:

  m7_gse80400:

    metadata_source_verified:
      true

    raw_sequence_public:
      true

    raw_sequence_repository:
      "SRA"

    library_strategy:
      "ncRNA-Seq"

    library_source:
      "transcriptomic"

    library_selection:
      "size fractionation"

    small_rna_protocol:
      "Illumina Small RNA Sample Preparation"

    read_mode:
      "single"

    candidate_length_compatible:
      true

    documented_processed_read_min_nt:
      15

    documented_processed_read_max_nt:
      35

    candidate_length_within_documented_range:
      true

    adapter_information_available:
      true

    documented_adapter_sequence:
      "CAAGCAGAAGACGGCATACGA"

    adapter_orientation_note:
      "adapter screened on minus strand in original processing"

    read_orientation_resolvable:
      true

    original_pipeline_trf_aware:
      true

    original_pipeline_trf_or_trna_derived_rna_reported:
      true

    ffpe:
      false

    technical_caveats:

      - "Original processing allowed mismatches for annotation."
      - "M7.4C exact-sequence counting must not inherit original annotation mismatches."
      - "Exact sequence abundance does not establish parent tRNA origin."
      - "Adapter handling must be verified against raw SRA representation before counting."

    evidence_status:
      "SOURCE_METADATA_SUFFICIENT"


