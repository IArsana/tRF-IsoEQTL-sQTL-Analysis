# ============================================================================
# Evidence-domain vocabulary
# ============================================================================

evidence_domains:

  disease_genetic:
    "DISEASE_GENETIC_EVIDENCE"

  regulatory:
    "REGULATORY_FEATURE_EVIDENCE"

  trf_identity:
    "TRF_IDENTITY_EVIDENCE"

  sequence:
    "TRF_SEQUENCE_EVIDENCE"

  external_molecular:
    "EXTERNAL_MOLECULAR_EVIDENCE"

  tcga_direct:
    "TCGA_DIRECT_TRF_EVIDENCE"

  clinical:
    "CLINICAL_ASSOCIATION_EVIDENCE"

  formal_coloc:
    "FORMAL_COLOCALIZATION_EVIDENCE"

  gene_assignment:
    "GENE_ASSIGNMENT_EVIDENCE"


# ============================================================================
# Integrated evidence classification
# ============================================================================

classification:

  no_additive_score:
    true

  preserve_m6_priority:
    true

  evidence_domain_count_is_descriptive_only:
    true

  domain_count_determines_priority:
    false

  classes:

    high_convergent:
      "INTEGRATED_MULTI_DOMAIN_CONVERGENT_EVIDENCE_WITHOUT_CAUSAL_RESOLUTION"

    genetic_supported_mechanistic_unresolved:
      "GENETIC_EVIDENCE_SUPPORTED_REGULATORY_AND_MOLECULAR_LINKS_UNRESOLVED"

    genetic_context_mechanistic_unresolved:
      "GENETIC_ASSOCIATION_CONTEXT_RETAINED_MECHANISTIC_LINK_UNRESOLVED"

    insufficient:
      "INTEGRATED_EVIDENCE_INSUFFICIENT_FOR_MECHANISTIC_RESOLUTION"


# ============================================================================
# Interpretation templates
# ============================================================================

interpretation:

  rs10216902:
    "Highest-priority candidate with convergent disease, regulatory-feature, tRF identity, external sequence-level molecular, and exact-variant GWAS evidence. However, the parent gene remains unresolved, standalone mature 24-nt tRF confirmation is absent, TCGA direct tRF quantification was not performed because controlled access was unavailable, effect direction is heterogeneous across publication families, formal colocalization was not justified, sample independence remains unresolved, and no causal inference is supported."

  rs2328376:
    "Intermediate-priority candidate with recurrent suggestive disease evidence and exact-variant representation across multiple GWAS analyses. The tRF identifier is resolved, but its exact sequence, regulatory feature, gene assignment, and external molecular validation remain unresolved. Directional heterogeneity occurs within at least one publication family, independent replication is not established, and no formal colocalization or causal inference is supported."

  rs1288100:
    "Lower-priority candidate retained by suggestive disease evidence and exact-variant representation in public prostate cancer GWAS summary statistics. Its exact tRF sequence, regulatory feature, gene assignment, and external molecular validation remain unresolved. Directional heterogeneity occurs within at least one publication family, independent replication is not established, and mechanistic or causal interpretation is not supported."


