# ============================================================================
# PCa-tRFQTL Research Pipeline
#
# File:
#   configs/m7_integrated_evidence_resolution.yaml
#
# Description:
#   M7.6 Integrated Evidence Resolution.
#
#   This stage performs structured evidence synthesis only.
#   It does NOT perform:
#     - new association testing;
#     - meta-analysis;
#     - colocalization;
#     - fine-mapping;
#     - imputation;
#     - causal inference;
#     - arbitrary additive scoring.
#
# Author:
#   I Putu Indra Arsana
#
# Project:
#   Integrative Analysis of Prostate Cancer Risk Variants,
#   tRNA-Derived Fragment QTLs, and Transcript Isoform Regulation
#
# License:
#   MIT
# ============================================================================


milestone:
