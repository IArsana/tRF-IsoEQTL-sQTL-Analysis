# ============================================================================
# Run-to-GEO mapping
#
# IMPORTANT:
# This mapping must be source verified before inferential modeling.
#
# M7.4D readiness does NOT rely on this mapping for declaring an endpoint
# association-ready.
# ============================================================================

run_mapping_policy:

  run_to_geo_mapping_verified:
    false

  permit_association_if_mapping_unverified:
    false

  infer_mapping_from_accession_order:
    false


# ============================================================================
# Endpoint definitions
# ============================================================================

endpoints:

  tumor_reference:

    endpoint_type:
      "BINARY"

    description:
      "PCa versus non-PCa/reference tissue"

    minimum_cases_per_group:
      3

    require_run_sample_mapping:
      true

    allow_reference_plus_bph_pooling:
      false


  recurrence:

    endpoint_type:
      "BINARY"

    description:
      "Explicit recurrent versus explicit cured PCa"

    minimum_cases_per_group:
      3

    require_explicit_status:
      true

    require_run_sample_mapping:
      true

    missing_status_is_non_event:
      false


  gleason:

    endpoint_type:
      "ORDINAL"

    description:
      "Source-reported Gleason score"

    minimum_total_samples:
      10

    minimum_samples_per_category:
      3

    require_at_least_categories:
      2

    require_run_sample_mapping:
      true


  hormone_refractory:

    endpoint_type:
      "BINARY"

    description:
      "Explicit hormone-refractory disease"

    minimum_positive_cases:
      3

    minimum_negative_cases:
      3

    require_run_sample_mapping:
      true


  lymph_node_pca:

    endpoint_type:
      "BINARY"

    description:
      "Explicit LN-PCa status"

    minimum_positive_cases:
      3

    minimum_negative_cases:
      3

    require_run_sample_mapping:
      true


  tmprss2_erg:

    endpoint_type:
      "BINARY"

    description:
      "Explicit TMPRSS2-ERG molecular subgroup"

    minimum_positive_cases:
      3

    minimum_negative_cases:
      3

    require_run_sample_mapping:
      true


# ============================================================================
# Cohort-level policy
# ============================================================================

readiness_policy:

  minimum_total_independent_samples_for_association:
    10

  minimum_group_size:
    3

  require_verified_run_to_sample_mapping:
    true

  duplicate_or_derived_material_not_independent:
    true

  ffpe_requires_sensitivity_analysis:
    true

  heterogeneous_source_groups_require_caution:
    true

  descriptive_molecular_validation_allowed:
    true

  inferential_clinical_association_requires_ready_endpoint:
    true


# ============================================================================
# Status vocabulary
# ============================================================================

statuses:

  endpoint:

    ready:
      "ASSOCIATION_READY"

    insufficient_group_support:
      "NOT_READY_INSUFFICIENT_GROUP_SUPPORT"

    incomplete_metadata:
      "NOT_READY_INCOMPLETE_CLINICAL_METADATA"

    mapping_unverified:
      "NOT_READY_RUN_SAMPLE_MAPPING_UNVERIFIED"

    heterogeneous:
      "NOT_READY_HETEROGENEOUS_CLINICAL_DEFINITION"


  overall:

    ready:
      "EXTERNAL_CLINICAL_ASSOCIATION_ROUTE_AVAILABLE"

    descriptive_only:
      "EXTERNAL_MOLECULAR_VALIDATION_RETAINED_CLINICAL_ASSOCIATION_NOT_JUSTIFIED"

    no_route:
      "EXTERNAL_CLINICAL_ASSOCIATION_NOT_AVAILABLE"


# ============================================================================
# Scientific safeguards
# ============================================================================

scientific_policy:

  readiness_audit_only:
    true

  association_model_fitted:
    false

  hypothesis_test_performed:
    false

  p_value_calculated:
    false

  effect_size_estimated:
    false

  survival_analysis_performed:
    false

  recurrence_model_performed:
    false

  group_pooling_performed:
    false

  missing_recurrence_interpreted_as_no:
    false

  run_sample_mapping_inferred_from_accession_order:
    false

  ffpe_treated_as_independent_without_verification:
    false

  mature_24nt_trf_abundance_claimed:
    false

  clinical_validation_claimed:
    false

  causal_inference_performed:
    false


# ============================================================================
# Outputs
# ============================================================================

outputs:

  processed_directory:
    "data/processed/m7/external_clinical_association_readiness"

  sample_inventory_filename:
    "gse80400_clinical_sample_inventory.parquet"

  endpoint_readiness_filename:
    "gse80400_clinical_endpoint_readiness.parquet"

  summary_filename:
    "external_clinical_association_readiness_summary.parquet"

  qc_relative_path:
    "data/processed/m7/qc/m7_4d_external_clinical_association_readiness.json"


# ============================================================================
# Next stage
# ============================================================================

next_stage:

  if_ready:
    "M7.4D_EXTERNAL_CLINICAL_ASSOCIATION"

  if_descriptive_only:
    "M7.5_VARIANT_LEVEL_VALIDATION_FEASIBILITY"