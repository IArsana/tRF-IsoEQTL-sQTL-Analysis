# ============================================================================

upstream_qc:

  fragment_interpretation:

    relative_path:
      "data/processed/m7/qc/m7_4c2c_candidate_fragment_interpretation.json"

    expected_milestone:
      "M7.4C.2C"

    expected_stage:
      "candidate_fragment_interpretation"

    expected_overall_status:
      "CANDIDATE_FRAGMENT_INTERPRETATION_COMPLETE"

    expected_evidence_class:
      "CANDIDATE_5PRIME_SEQUENCE_WITH_LONGER_FRAGMENT_CONTEXT"


# ============================================================================
# Molecular abundance input
#
# M7.4D does NOT reinterpret this as validated mature 24-nt tRF abundance.
# The quantitative variable remains exact candidate-sequence evidence.
# ============================================================================

molecular_input:

  run_counts_relative_path:
    "data/processed/m7/external_trf_exact_sequence_counting/gse80400_candidate_exact_sequence_counts.parquet"

  expected_runs:
    11

  abundance_variable:
    "candidate_cpm"

  abundance_interpretation:
    "EXACT_CANDIDATE_SEQUENCE_MOTIF_ABUNDANCE"

  mature_24nt_trf_abundance_claimed:
    false


